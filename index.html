<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex Panels 💪</title>
  <link href='https://fonts.googleapis.com/css?family=Amatic+SC' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/jpeg" href="hatsune-miku.jpg" />
</head>
<body>
  <style>
    html {
      box-sizing: border-box;
      background: #ffc600;
      font-family: 'helvetica neue';
      font-size: 20px;
      font-weight: 200;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
    }

    body {
      margin: 0;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    .container {
      display: flex;
      flex-direction: column;
    }
    .panels {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      
    }

    .panel {
      background: #4361ee;
      box-shadow: inset 0 0 0 5px rgba(255,255,255,0.1);
      color: white;
      text-align: center;
      align-items: center;
      transition:
        font-size 0.7s cubic-bezier(0.61,-0.19, 0.7,-0.11),
        flex 0.7s cubic-bezier(0.61,-0.19, 0.7,-0.11),
        background 0.2s;
      font-size: 20px;
      background-size: cover;
      background-position: center;
      flex: 1;
      justify-content: center;
      display: flex;
      flex-direction: column;
    }

    .panel1 { background-image:url(https://i.pinimg.com/736x/4f/67/eb/4f67eb36e32736b9adaffe127a592e42.jpg); }
    .panel2 { background-image:url(https://i.pinimg.com/736x/59/78/da/5978da4cde545de3e05b4f5214ce3e95.jpg); }
    .panel3 { background-image:url(https://i.pinimg.com/736x/a1/1f/fb/a11ffb4953cf2ccfafa6c3ee4afaad40.jpg); }
    .panel4 { background-image:url(https://i.pinimg.com/736x/4a/82/49/4a8249b597e042fa67b645518aa8ee19.jpg); }
    .panel5 { background-image:url(https://media1.tenor.com/m/JMWyTk5VL4sAAAAd/miku.gif); }

    .panel6 { background-image:url(https://media.tenor.com/c7M-9Nr_FPgAAAAm/hatsune-miku-hatsune.webp); }
    .panel7 { background-image:url(https://media.tenor.com/Gis-BDm6Q2oAAAAi/hatsune-miku.gif); }
    .panel8 { background-image:url(https://media.tenor.com/_Oz0ICrN9xgAAAAi/hatsune-miku.gif); }
    .panel9 { background-image:url(https://media.tenor.com/jLp3gH4CbzcAAAAm/miku-hatsune-miku.webp); }
    .panel10 { background-image:url(https://media.giphy.com/media/pnDwA1zLAfbYiySdJo/giphy.gif?cid=ecf05e4753ozd5bfj2gm3y3ejmbh3n2ufadfjopci5kwr3b0&ep=v1_gifs_search&rid=giphy.gif&ct=g); }

    
    .panel > * {
      margin: 0;
      width: 100%;
      transition: transform 0.5s;
      flex: 1 0 auto;
      display: flex-wrap;
      justify-content: center;
      align-items: center;
    }

    .panel > *:first-child { transform: translateY(-100%); }
    .panel.open-active > *:first-child { transform: translateY(0); }
    .panel > *:last-child { transform: translateY(100%); }
    .panel.open-active > *:last-child { transform: translateY(0); }

    .panel p {
      text-transform: uppercase;
      font-family: 'Amatic SC', cursive;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.72), 0 0 14px rgba(0, 0, 0, 0.45);
      font-size: 2em;
    }

    .panel p:nth-child(2) {
      font-size: 4em;
    }

    .panel.open {
      flex: 5;
      font-size: 40px;
    }

    @media only screen and (max-width: 600px) {
      .panel p {
        font-size: 1em;
      }
    }
  </style>

<div class="wrapper">
  <div class="panels">
    <div class="panel panel1">
      <p>YOU ARE</p>
      <p>ONE</p>
      <p>IF A KIND</p>
    </div>
    <div class="panel panel2">
      <p>IT TAKES</p>
      <p>TWO</p>
      <p>TO SUCCEED</p>
    </div>
    <div class="panel panel3">
      <p>ONLY</p>
      <p>THREE</p>
      <p>WORDS: NEVER GIVE UP</p>
    </div>
    <div class="panel panel4">
      <p>ARE YOU</p>
      <p>READY?</p>
      <p>ALWAYS BE.</p>
    </div>
    <div class="panel panel5">
      <p>MIKU</p>
      <p>MIKU</p>
      <p>BEAAAAAMM</p>
    </div>

    <div class="container">
    <div class="panel panel6">
      <p></p>
      <p>I'M</p>
      <p></p>
    </div>
    <div class="panel panel7">
      <p></p>
      <p>THINKING</p>
      <p></p>
    </div>
    <div class="panel panel8">
      <p></p>
      <p>MIKU</p>
      <p></p>
    </div>
    <div class="panel panel9">
      <p></p>
      <p>MIKU</p>
      <p></p>
    </div>
    <div class="panel panel10">
      <p></p>
      <p>OOEEEOO</p>
      <p></p>
    </div>
  </div>
  </div>
<script src="script.js"></script>
</body>
</html>
