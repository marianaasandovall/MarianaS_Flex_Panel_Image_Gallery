<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex Panels 💪</title>
  <link href='https://fonts.googleapis.com/css?family=Amatic+SC' rel='stylesheet' type='text/css'>
  <link rel="icon" href="https://fav.farm/✅" />
</head>
<body>
  <style>
    html {
      box-sizing: border-box;
      background: #ffc600;
      font-family: 'helvetica neue';
      font-size: 20px;
      font-weight: 200;
    }

    body {
      margin: 0;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    .panels {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }

    .panel {
      background: #6B0F9C;
      box-shadow: inset 0 0 0 5px rgba(255,255,255,0.1);
      color: white;
      text-align: center;
      align-items: center;
      transition:
        font-size 0.7s cubic-bezier(0.61,-0.19, 0.7,-0.11),
        flex 0.7s cubic-bezier(0.61,-0.19, 0.7,-0.11),
        background 0.2s;
      font-size: 20px;
      background-size: cover;
      background-position: center;
      flex: 1;
      justify-content: center;
      display: flex;
      flex-direction: column;
    }

    .panel1 { background-image:url(https://media.giphy.com/media/11tJVrEzcDleA8/giphy.gif?cid=790b7611oh38pcaf95ba9uock84qcp9epmlvt8scv7hdiix5&ep=v1_gifs_search&rid=giphy.gif&ct=g); }
    .panel2 { background-image:url(https://media.giphy.com/media/a9UWl87mMWeTrLlmJW/giphy.gif?cid=790b76117ucd6kby58xyc6vy8lkivwnk03o67sgl5iygyj0z&ep=v1_gifs_search&rid=giphy.gif&ct=g); }
    .panel3 { background-image:url(https://media.giphy.com/media/8UGGp7rQvfhe63HrFq/giphy.gif?cid=790b76111pi61qopjddkjmq0z91hthxbqkc9fhygd05pe17k&ep=v1_gifs_search&rid=giphy.gif&ct=g); }
    .panel4 { background-image:url(https://media.giphy.com/media/AFdcYElkoNAUE/giphy.gif?cid=790b76111pi61qopjddkjmq0z91hthxbqkc9fhygd05pe17k&ep=v1_gifs_search&rid=giphy.gif&ct=g); }
    .panel5 { background-image:url(https://media.giphy.com/media/RGEBbXsZT4v1m/giphy.gif?cid=ecf05e47546qwen72gmonvn00bvstm1fybs4g9177d1d4wig&ep=v1_gifs_search&rid=giphy.gif&ct=g); }

    
    .panel > * {
      margin: 0;
      width: 100%;
      transition: transform 0.5s;
      flex: 1 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .panel > *:first-child { transform: translateY(-100%); }
    .panel.open-active > *:first-child { transform: translateY(0); }
    .panel > *:last-child { transform: translateY(100%); }
    .panel.open-active > *:last-child { transform: translateY(0); }

    .panel p {
      text-transform: uppercase;
      font-family: 'Amatic SC', cursive;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.72), 0 0 14px rgba(0, 0, 0, 0.45);
      font-size: 2em;
    }

    .panel p:nth-child(2) {
      font-size: 4em;
    }

    .panel.open {
      flex: 5;
      font-size: 40px;
    }

    @media only screen and (max-width: 600px) {
      .panel p {
        font-size: 1em;
      }
    }
  </style>


  <div class="panels">
    <div class="panel panel1">
      <p>Hey</p>
      <p>Let's</p>
      <p>Dance</p>
    </div>
    <div class="panel panel2">
      <p>Give</p>
      <p>Take</p>
      <p>Receive</p>
    </div>
    <div class="panel panel3">
      <p>Experience</p>
      <p>It</p>
      <p>Today</p>
    </div>
    <div class="panel panel4">
      <p>Give</p>
      <p>All</p>
      <p>You can</p>
    </div>
    <div class="panel panel5">
      <p>Life</p>
      <p>In</p>
      <p>Motion</p>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
